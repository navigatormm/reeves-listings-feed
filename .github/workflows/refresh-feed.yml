name: Refresh listings feed

on:
  schedule:
    # Times are UTC. Covers 5am & 5pm Calgary time year-round.
    - cron: '0 0,11,12,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feed from reevesrealty.ca
        run: python build_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Refresh listings feed"
          git push
